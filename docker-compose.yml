services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      GEMINI_MODEL: gemini-flash-latest
      GENERATED_TESTS_DIR: /app/generated-tests
      PLAYWRIGHT_RUNNER_URL: http://playwright-runner:4050
      PLAYWRIGHT_RUNS_DIR: /app/playwright-runs
    volumes:
      - ./generated-tests:/app/generated-tests
      - ./playwright-runs:/app/playwright-runs
    depends_on:
      - playwright-runner

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

  playwright-runner:
    build:
      context: ./playwright-runner
    environment:
      PORT: 4050
      PLAYWRIGHT_RUNS_DIR: /workspace/runs
    volumes:
      - ./playwright-runs:/workspace/runs
